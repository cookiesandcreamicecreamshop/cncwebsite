<style>
body { margin: 0; background: #3B2027; }
a { color: #3B2027; }
a:hover { color: #1F6F68; }
.cc { --pink: #F7C6D0; --hot: #EE8FA7; --teal: #A9E2D8; --mint: #6FCFBE; --deep: #1F6F68; --choc: #3B2027; --cream: #FFF5EE; --tan: #D9A066; --cherry: #D93A52; --ease: cubic-bezier(.22,1,.36,1); --tx: 0; --ty: 0;
  font-family: 'Inter Tight', system-ui, sans-serif; color: var(--choc); background: var(--cream); overflow-x: clip; }
.cc * { box-sizing: border-box; }
.wrap { max-width: 1360px; margin: 0 auto; padding: 0 40px; }
.A { font-family: 'Anton', Impact, sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: 0; line-height: .86; margin: 0; }
.F { font-family: 'Fraunces', serif; font-style: italic; font-weight: 300; font-variation-settings: 'SOFT' 100, 'opsz' 144; text-transform: none; letter-spacing: -0.03em; }
.cap { font-size: 12px; letter-spacing: .26em; text-transform: uppercase; font-weight: 600; }
.btn { display: inline-flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 30px; border-radius: 999px; font: 600 14px 'Inter Tight', sans-serif; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; border: 2.5px solid var(--choc); cursor: pointer; box-shadow: 4px 4px 0 var(--choc); transition: transform .5s var(--ease), box-shadow .5s var(--ease), background .5s var(--ease), color .5s var(--ease); }
.btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--choc); }
.btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--choc); }
.b-choc { background: var(--choc); color: var(--cream); box-shadow: 4px 4px 0 var(--hot); }
.b-choc:hover { color: var(--cream); box-shadow: 2px 2px 0 var(--hot); }
.b-line { background: var(--cream); color: var(--choc); }
.b-line:hover { color: var(--choc); }
.b-pink { background: var(--pink); color: var(--choc); }
.b-pink:hover { color: var(--choc); }

/* hand-drawn system */
.boil { animation: boil .75s steps(1) infinite; }
@keyframes boil { 0% { filter: url(#b1); } 33% { filter: url(#b2); } 66% { filter: url(#b3); } }
.art svg { overflow: visible; display: block; width: 100%; height: auto; }
.dw { stroke-dasharray: 1; }
.intro .dw { animation: drawfill 2.4s var(--ease) both; animation-delay: var(--d, .2s); }
@keyframes drawfill { 0% { stroke-dashoffset: 1; fill-opacity: 0; } 55% { stroke-dashoffset: 0; fill-opacity: 0; } 100% { stroke-dashoffset: 0; fill-opacity: 1; } }
.spk { transform-box: fill-box; transform-origin: center; animation: twinkle 4.5s ease-in-out infinite; animation-delay: var(--d, 0s); }
@keyframes twinkle { 0%, 100% { transform: scale(.4) rotate(0deg); opacity: .3; } 50% { transform: scale(1) rotate(20deg); opacity: 1; } }
.sway { transform-box: view-box; transform-origin: 208px 600px; animation: sway 7s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
.drip { transform-box: fill-box; transform-origin: top; animation: drip 5s ease-in-out infinite; }
@keyframes drip { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.22); } }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame 2.8s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
@keyframes flame { from { transform: rotate(-6deg) scaleY(.96); } to { transform: rotate(6deg) scaleY(1.04); } }
.float { animation: drift 9s ease-in-out infinite alternate; animation-delay: var(--d, 0s); }
@keyframes drift { from { transform: translateY(-8px) rotate(-5deg); } to { transform: translateY(10px) rotate(5deg); } }
.mm { translate: calc(var(--tx) * 10px) calc(var(--ty) * 8px); transition: translate 1.2s var(--ease); }
.tilt { transform: perspective(1100px) rotateX(calc(var(--ty) * -4deg)) rotateY(calc(var(--tx) * 5deg)); transition: transform 1.2s var(--ease); }

/* nav */
.nav { position: sticky; top: 0; z-index: 60; background: rgba(255,245,238,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 2.5px solid var(--choc); }
.nav-in { display: flex; align-items: center; justify-content: space-between; height: 78px; gap: 20px; }
.nav-links { display: flex; gap: 30px; }
.nav-links a { position: relative; text-decoration: none; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--choc); padding: 8px 0; }
.nav-links a { text-decoration: underline wavy transparent; text-underline-offset: 7px; text-decoration-thickness: 2px; transition: text-decoration-color .6s var(--ease); }
.nav-links a:hover, .nav-links a.on { text-decoration-color: #EE8FA7; }

/* hero */
.hero { position: relative; background: var(--cream); overflow: hidden; background-image: radial-gradient(rgba(238,143,167,.22) 1.4px, transparent 1.6px); background-size: 18px 18px; }
.hero-art { position: relative; width: 470px; margin: 40px auto 0; z-index: 2; }
.doodle { position: absolute; z-index: 1; }
.word { overflow: hidden; text-align: center; white-space: nowrap; margin-top: -40px; position: relative; z-index: 3; padding-top: 10px; }
.word .A { font-size: clamp(64px, 13.1vw, 300px); color: var(--choc); display: inline-flex; text-shadow: 7px 7px 0 var(--hot); }
.word .ch { display: inline-block; animation: up 1.8s var(--ease) both; animation-delay: var(--d); }
.word .amp { color: var(--hot); text-shadow: 7px 7px 0 var(--choc); }
@keyframes up { from { transform: translateY(105%); opacity: 0; } }
.hero-foot { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; padding: 26px 0 50px; animation: fade 1.4s var(--ease) 1.6s both; }
@keyframes fade { from { opacity: 0; transform: translateY(20px); } }

/* awning */
.awn { display: block; width: 100%; height: 110px; margin-bottom: -2px; }
.awn .sc { transform-box: fill-box; transform-origin: top; transition: transform .9s var(--ease); transition-delay: calc(var(--i) * 22ms); }
.awn:hover .sc { transform: scaleY(1.12); }

.sec { position: relative; padding: 120px 0 130px; }
.H { font-size: clamp(80px, 11vw, 190px); }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 64px; }

/* menu */
.cats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 22px; }
.cat { border: 0; padding: 0; background: transparent; cursor: pointer; text-align: center; color: var(--choc); font-family: 'Inter Tight', sans-serif; }
.cat .frame { display: block; position: relative; aspect-ratio: 3 / 4; border-radius: 200px 200px 16px 16px; border: 2.5px solid var(--choc); box-shadow: 6px 6px 0 var(--choc); overflow: hidden; transition: box-shadow .6s var(--ease), transform .6s var(--ease); background-image: radial-gradient(rgba(59,32,39,.13) 1.3px, transparent 1.5px); background-size: 12px 12px; }
.cat .ico { position: absolute; left: 10%; right: 10%; top: 16%; transition: translate 1.2s var(--ease), rotate 1.2s var(--ease); translate: calc(var(--tx) * 10px) calc(var(--ty) * 8px); rotate: calc(var(--tx) * 5deg); }
.cat:hover .frame { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--choc); }
.cat.on .frame { box-shadow: 8px 8px 0 var(--hot); }
.cat .lbl { display: block; padding-top: 22px; font-family: 'Anton', sans-serif; font-size: 30px; text-transform: uppercase; }
.cat .lbl span { font-family: 'Fraunces', serif; font-style: italic; font-weight: 300; text-transform: none; font-size: 15px; display: block; color: var(--deep); margin-top: 4px; }
.panel { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 60px; margin-top: 70px; padding: 44px; border: 2.5px solid var(--choc); border-radius: 16px; background: #fff; box-shadow: 8px 8px 0 var(--teal); }
.panel h3 { font-size: 100px; }
.row { display: flex; align-items: baseline; gap: 14px; padding: 18px 0; border-bottom: 2px dotted rgba(59,32,39,.35); animation: fade 1s var(--ease) both; }
.row .n { font-family: 'Fraunces', serif; font-style: italic; font-weight: 300; font-size: 30px; letter-spacing: -0.02em; flex: 1; }
.row .p { font-weight: 600; }

/* order */
.order { background: var(--choc); color: var(--cream); }
.toggle { display: inline-flex; padding: 4px; border-radius: 999px; border: 2px solid rgba(255,245,238,.3); gap: 2px; }
.toggle button { font: 600 13px 'Inter Tight', sans-serif; letter-spacing: .1em; text-transform: uppercase; min-height: 44px; padding: 0 22px; border: 0; border-radius: 999px; cursor: pointer; background: transparent; color: rgba(255,245,238,.75); transition: background .6s var(--ease), color .6s var(--ease); }
.toggle button.on { background: var(--pink); color: var(--choc); }
.dl { display: flex; align-items: center; justify-content: space-between; gap: 30px; padding: 22px 0; border-bottom: 2px dashed rgba(255,245,238,.25); color: var(--cream); text-decoration: none; }
.dl:first-child { border-top: 2px dashed rgba(255,245,238,.25); }
.dl .dn { font-size: clamp(70px, 10vw, 170px); transition: transform 1s var(--ease), color .6s var(--ease); }
.dl:hover .dn { transform: translateX(14px); color: var(--pink); }
.badge { width: 130px; height: 130px; flex: 0 0 auto; }
.badge svg { transition: transform 1.4s var(--ease); }
.dl:hover .badge svg { transform: rotate(24deg) scale(1.05); }

/* parties */
.parties { background: var(--hot); }
.p-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 70px; align-items: center; }
.card { background: var(--cream); border-radius: 16px; padding: 44px; border: 2.5px solid var(--choc); box-shadow: 8px 8px 0 var(--choc); }
.lb { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; font-weight: 600; color: #6B5359; margin-bottom: 12px; display: block; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 26px; }
.seg2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { font: 600 13px 'Inter Tight', sans-serif; letter-spacing: .08em; text-transform: uppercase; min-height: 50px; padding: 10px; border-radius: 10px; border: 2px solid var(--choc); background: transparent; color: var(--choc); cursor: pointer; transition: background .5s var(--ease), color .5s var(--ease); }
.opt:hover { background: var(--pink); }
.opt.on { background: var(--choc); color: var(--cream); }
.step { display: flex; align-items: center; gap: 22px; margin-bottom: 26px; }
.step button { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--choc); background: transparent; font-size: 20px; color: var(--choc); cursor: pointer; }
.step button:hover { background: var(--teal); }
.step .n { font-family: 'Anton', sans-serif; font-size: 72px; line-height: 1; min-width: 90px; text-align: center; }
.inp { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-bottom: 28px; }
.inp label { display: flex; flex-direction: column; gap: 6px; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; font-weight: 600; color: #6B5359; }
.inp input { font: 400 16px 'Inter Tight', sans-serif; min-height: 46px; border: 0; border-bottom: 2px solid var(--choc); background: transparent; color: var(--choc); outline: none; letter-spacing: 0; text-transform: none; }
.done { text-align: center; padding: 60px 0; animation: fade 1.2s var(--ease) both; }

/* classes */
.classes { background: var(--teal); overflow: hidden; }
.c-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 80px; align-items: center; }
.cl { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 20px; padding: 24px 0; border-bottom: 2px dashed rgba(59,32,39,.35); }
.cl:first-child { border-top: 2px dashed rgba(59,32,39,.35); }
.cl .d { font-family: 'Anton', sans-serif; font-size: 56px; line-height: 1; text-transform: uppercase; }
.cl .s { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 600; color: var(--deep); margin-top: 8px; }

/* gram */
.gram { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; }
.g { display: block; aspect-ratio: 4 / 5; border: 2.5px solid var(--choc); box-shadow: 7px 7px 0 var(--choc); overflow: hidden; transition: rotate 1.2s var(--ease), box-shadow .6s var(--ease); rotate: calc(var(--tx) * 2deg); }
.g:nth-child(1) { border-radius: 200px 200px 14px 14px; }
.g:nth-child(2) { border-radius: 14px; box-shadow: 7px 7px 0 var(--hot); }
.g:nth-child(3) { border-radius: 50%; aspect-ratio: 1 / 1; align-self: center; }
.g:nth-child(4) { border-radius: 14px 14px 200px 200px; box-shadow: 7px 7px 0 var(--mint); }
.g img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.08); translate: calc(var(--tx) * -8px) calc(var(--ty) * -8px); transition: translate 1.2s var(--ease); }

/* locations */
.locs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 2.5px solid var(--choc); }
.loc { padding: 100px 50px 80px; overflow: hidden; position: relative; }
.loc.a { background: var(--pink); border-right: 2.5px solid var(--choc); }
.loc.b { background: var(--deep); color: var(--cream); }
.num { font-size: clamp(170px, 20vw, 330px); line-height: .82; color: transparent; -webkit-background-clip: text; background-clip: text; background-size: cover; background-position: calc(50% + var(--tx) * 6%) calc(50% + var(--ty) * 6%); transition: background-position 1.4s var(--ease); -webkit-text-stroke: 2.5px var(--choc); }
.loc.b .num { -webkit-text-stroke: 2.5px var(--cream); }
.num.n1 { background-image: url(assets/img/window.jpg); }
.num.n2 { background-image: radial-gradient(#F7C6D0 3px, transparent 3.5px); background-size: 16px 16px; background-position: calc(var(--tx) * 16px) calc(var(--ty) * 16px); }
.street { font-size: 54px; margin: 14px 0 28px; }
.hrs { display: grid; grid-template-columns: auto 1fr; gap: 8px 28px; font-size: 14px; letter-spacing: .06em; margin-bottom: 34px; }
.loc.b .btn { background: var(--cream); color: var(--choc); border-color: var(--cream); box-shadow: 4px 4px 0 var(--hot); }

/* news */
.news { background: var(--choc); color: var(--cream); text-align: center; padding: 120px 0 130px; position: relative; overflow: hidden; }
.news form { display: flex; gap: 10px; max-width: 560px; margin: 50px auto 0; padding: 6px; border-radius: 999px; border: 2.5px solid var(--cream); }
.news input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--cream); font: 400 16px 'Inter Tight', sans-serif; padding: 0 22px; outline: none; }
.news input::placeholder { color: rgba(255,245,238,.5); }
.news .btn { box-shadow: none; border-color: var(--pink); }
.foot { background: var(--choc); color: rgba(255,245,238,.6); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; padding: 30px 0; border-top: 1px solid rgba(255,245,238,.12); }
.foot a { color: rgba(255,245,238,.85); text-decoration: none; margin-left: 24px; }
.foot a:hover { color: var(--pink); }

@supports (animation-timeline: view()) {
  .rv { animation: fade linear both; animation-timeline: view(); animation-range: entry 5% cover 28%; }
  .scroll .dw { animation: drawfill linear both; animation-timeline: view(); animation-range: entry 0% cover 50%; }
  .awn .sc path { animation: drop linear both; animation-timeline: view(); animation-range: entry calc(var(--i) * 1.5%) cover calc(20% + var(--i) * 1.5%); transform-box: fill-box; transform-origin: top; }
  @keyframes drop { from { transform: scaleY(0); } }
  .pipe { animation: pipe linear both; animation-timeline: view(); animation-range: entry 0% cover 55%; }
  @keyframes pipe { from { transform: translate(60px, -70px) rotate(8deg); } }
}
@media (prefers-reduced-motion: reduce) {
  .cc *, .cc *::before, .cc *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 960px) {
  .wrap { padding: 0 20px; }
  .nav-links { display: none; }
  .hero-art { width: 300px; }
  .doodle { display: none; }
  .cats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .panel, .p-grid, .c-grid, .locs { grid-template-columns: minmax(0, 1fr); }
  .panel { padding: 24px; }
  .panel h3 { font-size: 60px; }
  .sec { padding: 90px 0; }
  .badge { width: 70px; height: 70px; }
  .gram { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .loc { padding: 70px 20px; }
  .loc.a { border-right: 0; border-bottom: 2.5px solid var(--choc); }
  .inp, .seg { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 26px; }
  .awn { height: 70px; }
}

.S { font-family: 'Shrikhand', serif; font-weight: 400; letter-spacing: 0; line-height: .95; margin: 0; }
.K { font-family: 'Caveat', cursive; font-weight: 700; letter-spacing: 0; line-height: 1; }
.note { position: absolute; display: flex; align-items: center; gap: 6px; font-family: 'Caveat', cursive; font-weight: 700; font-size: 30px; color: var(--choc); z-index: 4; white-space: nowrap; }
.note svg { overflow: visible; }
.page-in { animation: pagein 1.2s var(--ease) both; }
@keyframes pagein { from { opacity: 0; transform: translateY(24px); } }
.home { position: relative; background: var(--cream); overflow: hidden; background-image: radial-gradient(rgba(238,143,167,.22) 1.4px, transparent 1.6px); background-size: 18px 18px; }
.home-grid { position: relative; z-index: 2; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; align-items: center; min-height: 780px; padding-top: 20px; padding-bottom: 30px; }
.wm { font-size: clamp(76px, 14vw, 220px); color: var(--choc); text-shadow: 7px 7px 0 var(--hot); display: flex; flex-direction: column; }
.wm .ln { display: block; overflow: hidden; padding-right: 12px; padding-bottom: 8px; }
.wm .ch { display: inline-block; animation: up 1.6s var(--ease) both; animation-delay: var(--d); }
.wm .amp { color: var(--hot); text-shadow: 7px 7px 0 var(--choc); }
.cone-col { position: relative; max-width: 400px; justify-self: center; width: 100%; }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
.qk { position: relative; display: block; text-decoration: none; color: var(--choc); border: 2.5px solid var(--choc); border-radius: 18px; padding: 26px 24px 22px; box-shadow: 6px 6px 0 var(--choc); transition: transform .6s var(--ease), box-shadow .6s var(--ease); background-image: radial-gradient(rgba(59,32,39,.12) 1.3px, transparent 1.5px); background-size: 12px 12px; }
.qk:hover { color: var(--choc); transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--choc); }
.qk .ic { display: block; width: 120px; margin: 0 auto 10px; translate: calc(var(--tx) * 8px) calc(var(--ty) * 6px); rotate: calc(var(--tx) * 6deg); transition: translate 1.1s var(--ease), rotate 1.1s var(--ease); }
.qk .t1 { font-family: 'Shrikhand', serif; font-size: 34px; display: block; text-align: center; }
.qk .t2 { font-family: 'Caveat', cursive; font-weight: 700; font-size: 24px; display: block; text-align: center; color: var(--deep); margin-top: 4px; }
.board { position: relative; background: #fff; border: 2.5px solid var(--choc); border-radius: 18px; padding: 50px; box-shadow: 10px 10px 0 var(--choc); outline: 2px solid var(--choc); outline-offset: -14px; }
.bunting { display: block; width: 100%; height: 150px; overflow: visible; }
.flag { transform-box: fill-box; transform-origin: 50% 0; animation: flag 3.4s ease-in-out infinite alternate; animation-delay: var(--d); }
@keyframes flag { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
.balloon { position: absolute; z-index: 1; animation: rise2 8s ease-in-out infinite alternate; animation-delay: var(--d); }
@keyframes rise2 { from { transform: translateY(10px) rotate(-4deg); } to { transform: translateY(-16px) rotate(4deg); } }
.cl .d .hl { background: #A9E2D8; padding: 0 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.incl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 50px; }
.incl div { text-align: center; }
.incl svg { width: 110px; height: auto; display: block; margin: 0 auto 8px; overflow: visible; }
.incl span { font-family: 'Caveat', cursive; font-weight: 700; font-size: 28px; }
.shops { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; }
.shop { border: 2.5px solid var(--choc); border-radius: 22px; padding: 34px; box-shadow: 8px 8px 0 var(--choc); }
.shop .art { max-width: 420px; margin: 0 auto 10px; }
.addr { font-size: clamp(60px, 7vw, 110px); }
.subfoot { background: var(--choc); color: var(--cream); padding: 60px 0; }
/* uniform page system */
.phead { margin-bottom: 64px; }
.ptitle { font-size: calc(clamp(72px, 9vw, 136px) * var(--ts, 1)) !important; }
.wm { font-size: calc(clamp(76px, 14vw, 220px) * var(--ts, 1)) !important; }
.still *, .still *::before, .still *::after { animation: none !important; transition: none !important; }
.nowobble .boil { animation: none !important; filter: none !important; }
.big1 { display: block; font-size: clamp(40px, 10.5vw, 168px); line-height: 1; white-space: nowrap; margin: 6px 0 0; }
